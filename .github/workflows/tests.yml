name: Running tests

on:
  pull_request:
    branches: [ develop ]

env:
  GOPRIVATE: "github:com/Botifi/*:"

jobs:

  build:
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: Checkout the repository
      run: |
        git config --global url."https://ssimuss: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@github.com".insteadOf https://github.com

    - name: Start Redis
      uses: supercharge/redis-github-action@1.6.0
      with:
        redis-version: 5

    - name: Set up Go 1.19
      uses: actions/setup-go@v1
      with: 
        go-version: 1.19

    - uses: actions/cache@v2
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Run Test
      run: |
        go test -v ./... -covermode=count -coverprofile=coverage.out
        go tool cover -func=coverage.out -o=coverage.out

    - name: Send noty to discord (Failure on running tests)
      uses: rjstone/discord-webhook-notify@v1
      if: failure()
      with:
        severity: error
        details: Telegram bot app tests are failed!
        webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}

    - name: Go Coverage Badge  # Pass the `coverage.out` output to this action
      uses: tj-actions/coverage-badge-go@v2
      with:
        filename: coverage.out

    - name: Verify Changed files
      uses: tj-actions/verify-changed-files@v12
      id: verify-changed-files
      with:
        files: README.md

    - name: Commit changes
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git commit -m "chore: Updated coverage badge."

    - name: Push changes
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ github.token }}
        branch: ${{ github.head_ref }}